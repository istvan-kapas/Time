<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>myTime & Expenses</title>
<link rel="stylesheet" href="design-system.css">
<style>
/* timesheet-v2.html — page-specific overrides only */
.status-pill       { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 600; }
.status-pill.draft     { background: rgba(107,120,151,.1); color: var(--muted-fg); border: 1px solid rgba(107,120,151,.2); }
.status-pill.submitted { background: rgba(59,79,191,.1); color: var(--billable); border: 1px solid rgba(59,79,191,.25); }
/* v2 toast sits above the fixed submit bar */
.toast { bottom: 70px; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <div class="logo">myTime &amp; Expenses</div>
  <nav>
    <div class="nav-link active">Time</div>
    <div class="nav-link">Expenses</div>
    <div class="nav-link">Charge Codes</div>
    <div class="nav-link">Summary</div>
    <div class="nav-link">Preferences</div>
  </nav>
  <div class="header-right">
    <button class="hdr-icon">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <div class="avatar">IK</div>
  </div>
</header>

<!-- PERIOD BAR -->
<div class="period-bar">
  <div class="period-top">
    <div class="period-nav">
      <button class="nav-arrow" onclick="showToast('Previous period','📅')">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="period-label">Jul 16 – Jul 31, 2026</div>
      <button class="nav-arrow" onclick="showToast('Next period','📅')">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <span class="status-pill draft" id="statusPill"><span class="dot"></span>Draft</span>
    <div class="period-actions">
      <span class="period-progress-label"><strong id="headerTotal">94.0</strong>h of 96.0h logged</span>
      <button class="btn btn-primary" onclick="handleSubmit()">
        Submit timesheet
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>

  <div class="day-tiles" id="dayTiles"></div>
</div>

<!-- QUICK LOG -->
<div class="quick-log">
  <div class="quick-form">
    <input class="task-input" id="taskInput" placeholder="What did you work on today?" autocomplete="off">
    <select class="project-select" id="projectSelect">
      <option value="au">AU_Extl Tech — CU17L001</option>
      <option value="beta">Beta Launch — BL7821</option>
      <option value="internal">Internal / Admin</option>
      <option value="client">Client Meeting</option>
    </select>
    <input class="dur-input" id="durInput" placeholder="h:mm" maxlength="5">
    <button class="btn btn-accent" onclick="quickAdd()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Log time
    </button>
  </div>

  <div class="timer-strip">
    <div class="timer-running" id="timerRunning" style="display:none">
      <div class="timer-dot"></div>
      <div class="timer-task" id="timerTask">Running…</div>
      <div class="timer-display" id="timerDisplay">0:00:00</div>
      <button class="btn btn-ghost btn-sm" onclick="stopTimer()">Stop</button>
    </div>
    <div class="timer-idle" id="timerIdle">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      No timer running
    </div>
    <button class="btn btn-ghost btn-sm" id="startTimerBtn" onclick="startTimer()">
      <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Start timer
    </button>
  </div>
</div>

<!-- ENTRIES -->
<div class="entries-wrap" id="entriesWrap"></div>

<!-- SUBMIT BAR -->
<div class="submit-bar">
  <div class="submit-progress">
    <div class="submit-label">
      <span>Period progress</span>
      <strong id="submitTotal">94.0h</strong>
    </div>
    <div class="submit-track"><div class="submit-fill" id="submitFill" style="width:97.9%"></div></div>
  </div>
  <button class="btn btn-ghost" onclick="openModal()">
    <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Add entry
  </button>
  <button class="btn btn-primary" onclick="handleSubmit()">Submit timesheet</button>
</div>

<!-- ADD ENTRY MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title">Add time entry</div>
    <div class="form-group">
      <label class="form-label">Task description</label>
      <input class="form-input" id="mTask" placeholder="e.g. API integration — auth module" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">Charge code / Project</label>
      <select class="form-input" id="mProject">
        <option value="au" data-color="#0B7C7C">AU_Extl Tech_AIP_68072_5301 (CU17L001)</option>
        <option value="beta" data-color="#3B4FBF">Beta Launch QA (BL7821)</option>
        <option value="internal" data-color="#7C3AED">Internal / Admin</option>
        <option value="client" data-color="#C47F17">Client Meeting (CM4402)</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date</label>
        <input class="form-input" type="date" id="mDate" value="2026-07-27">
      </div>
      <div class="form-group">
        <label class="form-label">Duration (hours)</label>
        <input class="form-input" id="mDur" placeholder="e.g. 2.5 or 2:30" autocomplete="off">
      </div>
    </div>
    <div class="form-group">
      <label class="checkbox-row">
        <input type="checkbox" id="mBillable" checked>
        Billable to client
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-accent" onclick="addFromModal()">Add entry</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><span id="toastIcon">✓</span><span id="toastMsg">Saved</span></div>

<script>
// ── DATA ────────────────────────────────────────────────────────
const PERIOD_DAYS = [
  {d:16,w:'Thu',wknd:false},{d:17,w:'Fri',wknd:false},
  {d:18,w:'Sat',wknd:true}, {d:19,w:'Sun',wknd:true},
  {d:20,w:'Mon',wknd:false},{d:21,w:'Tue',wknd:false},
  {d:22,w:'Wed',wknd:false},{d:23,w:'Thu',wknd:false},
  {d:24,w:'Fri',wknd:false},{d:25,w:'Sat',wknd:true},
  {d:26,w:'Sun',wknd:true}, {d:27,w:'Mon',wknd:false},
  {d:28,w:'Tue',wknd:false},{d:29,w:'Wed',wknd:false},
  {d:30,w:'Thu',wknd:false},{d:31,w:'Fri',wknd:false},
];

const PROJECTS = {
  au:       { name:'AU_Extl Tech',    id:'CU17L001', color:'#0B7C7C' },
  beta:     { name:'Beta Launch QA',  id:'BL7821',   color:'#3B4FBF' },
  internal: { name:'Internal / Admin',id:'INT000',   color:'#7C3AED' },
  client:   { name:'Client Meeting',  id:'CM4402',   color:'#C47F17' },
};

const STATUS_MAP = { approved:'badge-approved', submitted:'badge-submitted', draft:'badge-draft', pending:'badge-pending' };
const STATUS_LABELS = { approved:'Approved', submitted:'Submitted', draft:'Draft', pending:'Pending' };

let entries = [
  { id:1,  date:16, proj:'au', task:'Development sprint — sprint planning',       billable:true,  hours:8.0, status:'approved' },
  { id:2,  date:17, proj:'au', task:'Code review & QA pass',                      billable:true,  hours:8.0, status:'approved' },
  { id:3,  date:20, proj:'au', task:'API integration — auth module',              billable:true,  hours:3.0, status:'approved' },
  { id:4,  date:20, proj:'internal', task:'Team standup',                         billable:false, hours:0.5, status:'approved' },
  { id:5,  date:20, proj:'au', task:'UI review with design team',                 billable:true,  hours:2.5, status:'approved' },
  { id:6,  date:20, proj:'au', task:'Bug investigation — session expiry',         billable:true,  hours:2.0, status:'approved' },
  { id:7,  date:21, proj:'au', task:'Backend refactor — data layer',              billable:true,  hours:6.0, status:'approved' },
  { id:8,  date:21, proj:'internal', task:'1:1 with manager',                     billable:false, hours:1.0, status:'approved' },
  { id:9,  date:21, proj:'client', task:'Discovery call — Phase 2 scope',         billable:true,  hours:1.0, status:'approved' },
  { id:10, date:22, proj:'au', task:'Feature implementation — export module',     billable:true,  hours:5.0, status:'submitted' },
  { id:11, date:22, proj:'beta', task:'QA testing — regression suite',            billable:true,  hours:3.0, status:'submitted' },
  { id:12, date:23, proj:'au', task:'Deploy to staging & smoke tests',            billable:true,  hours:4.0, status:'submitted' },
  { id:13, date:23, proj:'beta', task:'Beta feedback review',                     billable:true,  hours:3.0, status:'submitted' },
  { id:14, date:23, proj:'internal', task:'Documentation update',                 billable:false, hours:1.0, status:'submitted' },
  { id:15, date:24, proj:'au', task:'Production deployment',                      billable:true,  hours:6.0, status:'submitted' },
  { id:16, date:24, proj:'client', task:'Client demo — Phase 2 features',         billable:true,  hours:2.0, status:'submitted' },
  { id:17, date:27, proj:'au', task:'Sprint kickoff — week 30',                   billable:true,  hours:2.0, status:'draft' },
  { id:18, date:27, proj:'au', task:'Critical bug fix — login flow',              billable:true,  hours:4.0, status:'draft' },
  { id:19, date:27, proj:'internal', task:'Team retrospective',                   billable:false, hours:1.0, status:'draft' },
  { id:20, date:28, proj:'au', task:'Hotfix deployment',                          billable:true,  hours:3.5, status:'draft' },
  { id:21, date:28, proj:'beta', task:'Beta v2 planning',                         billable:true,  hours:2.5, status:'draft' },
  { id:22, date:28, proj:'au', task:'Code review',                                billable:true,  hours:2.0, status:'draft' },
  { id:23, date:29, proj:'au', task:'Architecture review',                        billable:true,  hours:3.0, status:'draft' },
  { id:24, date:29, proj:'client', task:'Client check-in call',                   billable:true,  hours:1.0, status:'draft' },
  { id:25, date:29, proj:'au', task:'Implementation — new endpoints',             billable:true,  hours:4.0, status:'draft' },
  { id:26, date:30, proj:'au', task:'Integration testing',                        billable:true,  hours:5.0, status:'draft' },
  { id:27, date:30, proj:'beta', task:'Release candidate prep',                   billable:true,  hours:3.0, status:'draft' },
  { id:28, date:31, proj:'au', task:'Final QA sign-off',                          billable:true,  hours:4.0, status:'draft' },
  { id:29, date:31, proj:'au', task:'Handover documentation',                     billable:true,  hours:4.0, status:'draft' },
];
let nextId = 30;

// ── TIMER ───────────────────────────────────────────────────────
let timerRunning = false, timerStart = null, timerInterval = null, timerTaskName = '';

function startTimer() {
  const task = document.getElementById('taskInput').value.trim();
  if (!task) { showToast('Enter a task description first', '⚠'); document.getElementById('taskInput').focus(); return; }
  timerTaskName = task;
  timerStart = Date.now();
  timerRunning = true;
  document.getElementById('timerTask').textContent = task;
  document.getElementById('timerRunning').style.display = 'flex';
  document.getElementById('timerIdle').style.display = 'none';
  document.getElementById('startTimerBtn').style.display = 'none';
  timerInterval = setInterval(updateTimerDisplay, 1000);
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const elapsed = Math.floor((Date.now() - timerStart) / 1000);
  const h = Math.floor(elapsed / 3600);
  const m = Math.floor((elapsed % 3600) / 60);
  const s = elapsed % 60;
  document.getElementById('timerDisplay').textContent =
    `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function stopTimer() {
  if (!timerRunning) return;
  clearInterval(timerInterval);
  const elapsed = (Date.now() - timerStart) / 3600000;
  timerRunning = false;
  document.getElementById('timerRunning').style.display = 'none';
  document.getElementById('timerIdle').style.display = 'flex';
  document.getElementById('startTimerBtn').style.display = 'flex';
  const proj = document.getElementById('projectSelect').value;
  addEntry(timerTaskName, proj, 27, Math.round(elapsed * 4) / 4, true);
  document.getElementById('taskInput').value = '';
  showToast(`Logged ${formatDur(elapsed)} for "${timerTaskName}"`, '✓');
}

// ── QUICK ADD ───────────────────────────────────────────────────
function quickAdd() {
  const task = document.getElementById('taskInput').value.trim();
  const proj = document.getElementById('projectSelect').value;
  const durRaw = document.getElementById('durInput').value.trim();
  if (!task) { showToast('Enter a task description', '⚠'); document.getElementById('taskInput').focus(); return; }
  if (!durRaw) { showToast('Enter duration (e.g. 2:30 or 2.5)', '⚠'); document.getElementById('durInput').focus(); return; }
  const hours = parseDur(durRaw);
  if (!hours) { showToast('Invalid duration format', '⚠'); return; }
  addEntry(task, proj, 27, hours, true);
  document.getElementById('taskInput').value = '';
  document.getElementById('durInput').value = '';
  showToast(`${formatDur(hours)} logged`, '✓');
}

function parseDur(s) {
  if (s.includes(':')) {
    const [h, m] = s.split(':').map(Number);
    return h + (m||0)/60;
  }
  const n = parseFloat(s);
  return isNaN(n) || n <= 0 ? null : n;
}

function formatDur(h) {
  const hrs = Math.floor(h);
  const mins = Math.round((h - hrs) * 60);
  return mins ? `${hrs}h ${mins}m` : `${hrs}h`;
}

// ── ENTRY CRUD ──────────────────────────────────────────────────
function addEntry(task, proj, date, hours, billable) {
  entries.unshift({ id: nextId++, date, proj, task, billable, hours, status: 'draft' });
  render();
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  render();
  showToast('Entry removed', '✓');
}

function duplicateEntry(id) {
  const src = entries.find(e => e.id === id);
  if (!src) return;
  entries.unshift({ ...src, id: nextId++, status: 'draft', date: 27 });
  render();
  showToast('Entry duplicated', '✓');
}

// ── MODAL ───────────────────────────────────────────────────────
function openModal() {
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('mTask').focus(), 150);
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeModalOutside(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

function addFromModal() {
  const task = document.getElementById('mTask').value.trim();
  const proj = document.getElementById('mProject').value;
  const dateRaw = document.getElementById('mDate').value;
  const durRaw = document.getElementById('mDur').value.trim();
  const billable = document.getElementById('mBillable').checked;
  if (!task) { showToast('Task description required', '⚠'); return; }
  const hours = parseDur(durRaw);
  if (!hours) { showToast('Invalid duration', '⚠'); return; }
  const date = dateRaw ? parseInt(dateRaw.split('-')[2]) : 27;
  addEntry(task, proj, date, hours, billable);
  closeModal();
  document.getElementById('mTask').value = '';
  document.getElementById('mDur').value = '';
  showToast(`${formatDur(hours)} logged`, '✓');
}

// ── RENDER ──────────────────────────────────────────────────────
function dayHours(d) { return entries.filter(e => e.date === d).reduce((s,e) => s + e.hours, 0); }

function renderDayTiles() {
  const SCHED = 8;
  let html = '';
  PERIOD_DAYS.forEach(day => {
    const hrs = dayHours(day.d);
    const pct = day.wknd ? 0 : Math.min(100, (hrs / SCHED) * 100);
    const fillCls = day.wknd ? 'empty' : pct >= 100 ? 'full' : hrs > 0 ? 'partial' : 'empty';
    const cls = ['day-tile', day.wknd?'weekend':'', day.d===27?'today':''].filter(Boolean).join(' ');
    html += `<div class="${cls}" onclick="scrollToDay(${day.d})">
      <div class="tile-dow">${day.w}</div>
      <div class="tile-date">${day.d}</div>
      <div class="tile-hours">${hrs > 0 ? hrs.toFixed(1)+'h' : day.wknd ? '—' : '0h'}</div>
      <div class="tile-bar"><div class="tile-bar-fill ${fillCls}" style="width:${pct}%"></div></div>
    </div>`;
  });
  document.getElementById('dayTiles').innerHTML = html;
}

function renderEntries() {
  const days = [...new Set(entries.map(e => e.date))].sort((a,b) => b-a);
  let html = '';
  days.forEach(d => {
    const dayEntries = entries.filter(e => e.date === d).sort((a,b) => b.id - a.id);
    const dayInfo = PERIOD_DAYS.find(x => x.d === d);
    const total = dayEntries.reduce((s,e) => s+e.hours, 0);
    const isToday = d === 27;
    const dow = dayInfo ? dayInfo.w : '';
    const label = isToday ? 'Today' : dow;
    html += `<div class="day-group" id="day-${d}">
      <div class="day-header">
        <span class="day-header-label ${isToday?'day-header-today':''}">${label}</span>
        <span class="day-header-date">Jul ${d}, 2026</span>
        <span class="day-total">${total.toFixed(1)}h</span>
      </div>`;
    dayEntries.forEach(e => {
      const p = PROJECTS[e.proj] || PROJECTS.au;
      const badgeCls = STATUS_MAP[e.status] || 'badge-draft';
      const badgeLabel = STATUS_LABELS[e.status] || 'Draft';
      html += `<div class="entry-row" data-id="${e.id}">
        <div class="entry-dot" style="background:${p.color}"></div>
        <div class="entry-main">
          <div class="entry-task">${e.task}</div>
          <div class="entry-meta">${p.name} · ${p.id}</div>
        </div>
        <span class="billable-flag ${e.billable?'yes':''}">
          ${e.billable
            ? `<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Billable`
            : `Non-billable`}
        </span>
        <span class="entry-dur">${formatDur(e.hours)}</span>
        <span class="badge ${badgeCls}"><span class="dot"></span>${badgeLabel}</span>
        <div class="entry-actions">
          <button class="icon-btn" title="Duplicate" onclick="duplicateEntry(${e.id})">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="icon-btn del" title="Delete" onclick="deleteEntry(${e.id})">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
        </div>
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('entriesWrap').innerHTML = html;
}

function renderSummary() {
  const total = entries.reduce((s,e) => s+e.hours, 0);
  const pct = Math.min(100, (total/96)*100);
  document.getElementById('headerTotal').textContent = total.toFixed(1);
  document.getElementById('submitTotal').textContent = total.toFixed(1)+'h';
  document.getElementById('submitFill').style.width = pct+'%';
}

function render() {
  renderDayTiles();
  renderEntries();
  renderSummary();
}

function scrollToDay(d) {
  const el = document.getElementById('day-'+d);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
}

// ── SUBMIT ──────────────────────────────────────────────────────
function handleSubmit() {
  const draftCount = entries.filter(e => e.status === 'draft').length;
  if (draftCount === 0) { showToast('All entries already submitted', '✓'); return; }
  entries.forEach(e => { if (e.status === 'draft') e.status = 'submitted'; });
  render();
  const pill = document.getElementById('statusPill');
  pill.className = 'status-pill submitted';
  pill.innerHTML = '<span class="dot"></span>Submitted';
  showToast(`${draftCount} entr${draftCount===1?'y':'ies'} submitted for approval`, '✓');
}

// ── TOAST ───────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, icon='✓') {
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastIcon').textContent = icon;
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ── NAV ─────────────────────────────────────────────────────────
document.querySelectorAll('.nav-link').forEach(el => {
  el.addEventListener('click', function() {
    document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
    this.classList.add('active');
  });
});

// ── KEYBOARD ────────────────────────────────────────────────────
document.getElementById('durInput').addEventListener('keydown', e => { if (e.key==='Enter') quickAdd(); });
document.getElementById('taskInput').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('durInput').focus(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

render();
</script>
</body>
</html>
